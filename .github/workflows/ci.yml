# Builds Uplift and runs its tests on Linux and Windows, for every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Uplift.slnx -c Release -nologo
      - name: Test
        run: dotnet test tests/Uplift.Tests/Uplift.Tests.csproj -c Release --no-build -nologo
